analyze_gas:
  description: >
    Check the current gas price on chain {chain_id}.
    Use the gas_tools to get the price and determine if it's optimal, high, or critical.
    Return a decision: EXECUTE, WAIT, or WAIT_URGENT.
  expected_output: >
    A JSON object with: decision (EXECUTE/WAIT/WAIT_URGENT), gas_price (in gwei), chain_id
  agent: market_optimizer

calculate_distribution:
  description: >
    Get the treasury position for company with pool address {pool_address} and owner address {owner_address}.
    Calculate how much each of the {recipient_count} recipients should receive.
    Deduct the 5% protocol fee from the yield before distribution.
  expected_output: >
    A JSON object with: total_to_distribute, protocol_fee, per_recipient, recipient_count
  agent: treasury_analyst
  context:
    - analyze_gas

notify_ceo_waiting:
  description: >
    Gas prices are elevated. Send a notification to {ceo_email} explaining:
    - Current gas price
    - Estimated wait time (15 minutes)
    - Include a "Pay Anyway" override link: {override_link}
  expected_output: >
    Confirmation that the email was sent successfully with the email ID.
  agent: compliance_officer
  context:
    - analyze_gas

notify_ceo_urgent:
  description: >
    Gas has been high for an extended period ({hours_waited} hours).
    Send an urgent notification to {ceo_email} requesting a decision.
    Include the override link: {override_link}
  expected_output: >
    Confirmation that the urgent email was sent successfully.
  agent: compliance_officer
  context:
    - analyze_gas

notify_ceo_complete:
  description: >
    Payroll has been executed successfully.
    Send a completion notification to {ceo_email} with:
    - Total amount distributed
    - Number of employees paid
    - Transaction hash
  expected_output: >
    Confirmation that the completion email was sent successfully.
  agent: compliance_officer
  context:
    - calculate_distribution
  
get_payroll_details:
  description: >
    Fetch the payroll details from the smart contract at {contract_address} using payroll ID {payroll_id}.
    Use the "Get Payroll Details" tool with:
    - contract_address: {contract_address}
    - payroll_id: {payroll_id}
    
    Retrieve:
    - List of all recipients (wallet addresses)
    - Payment amount for each recipient
    - Total amount required for this payroll
    
    After getting the payroll details, also check if the treasury has sufficient funds:
    - Get the treasury position using pool address {pool_address} and owner address {owner_address}
    - Compare available funds against total_required
    - If funds are insufficient, report this clearly in your output
  expected_output: >
    A JSON object with:
    - payroll_id
    - contract_address
    - recipients: list of {address, amount}
    - total_required: sum of all payments
    - recipient_count: number of recipients
    - treasury_available: funds in treasury
    - is_sufficient: boolean indicating if funds cover payroll
    - shortfall: amount needed if insufficient (0 if sufficient)
  agent: treasury_analyst

execute_payroll:
  execute_payroll:
  description: >
    Execute payroll using Circle Gateway for cross-chain USDC transfers.
    Use the "Execute Payroll" tool with:
    - payroll_id: {payroll_id}
    - recipients: (list from get_payroll_details - includes address, amount, dest_chain)
    - source_chain_id: {source_chain_id}
    - wallet_id: {wallet_id}
    
    For recipients where dest_chain differs from source_chain_id, use Circle Gateway (CCTP) to bridge.
    For same-chain recipients, do direct transfer.
  expected_output: >
    A JSON object with:
    - status: success or failure
    - payroll_id
    - tx_hashes: list of transaction hashes
    - total_paid: sum of all payments
    - recipient_count: number of recipients paid
  agent: treasury_analyst
  context:
    - get_payroll_details
    - analyze_gas
