[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [
    {access = "read-write", path = ".forge-snapshots/"},
    {access = "write", path = "../agent/src/addresses.json"}
]
libs = ["lib"]
out = "out"
auto_detect_solc = true
src = "src"
via_ir = true

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

# Network configurations
[rpc_endpoints]
baseSepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
sepolia = "https://1rpc.io/sepolia"
arc = "https://rpc.testnet.arc.network"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }

# Arc uses Blockscout for verification (API key optional)
